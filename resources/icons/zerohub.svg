<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
>
  <defs>
    <linearGradient
      id="background"
      x1="140"
      y1="100"
      x2="880"
      y2="930"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#7886ff"/>
      <stop offset="0.52" stop-color="#5263f0"/>
      <stop offset="1" stop-color="#283694"/>
    </linearGradient>

    <linearGradient
      id="letter"
